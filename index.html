<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Slider</title>
  <!-- Link to external CSS file for styling -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Main container that holds the entire image slider -->
  <div class="slider-container">

    <!-- Inner slider that contains all the individual slides -->
    <div class="slider">
      <!-- Each .slide contains one image -->
      <div class="slide"><img src="https://picsum.photos/id/176/1300/1000" alt="Image1" /></div>
      <div class="slide"><img src="https://picsum.photos/id/10/1300/1000" alt="Image2" /></div>
      <div class="slide"><img src="https://picsum.photos/id/13/1300/1000" alt="Image3" /></div>
      <div class="slide"><img src="https://picsum.photos/id/128/1300/1000" alt="Image4" /></div>
      <div class="slide"><img src="https://picsum.photos/id/271/1300/1000" alt="Image5" /></div>
      <div class="slide"><img src="https://picsum.photos/id/280/1300/1000" alt="Image6" /></div>
      <div class="slide"><img src="https://picsum.photos/id/675/1300/1000" alt="Image7" /></div>
      <div class="slide"><img src="https://picsum.photos/id/569/1300/1000" alt="Image8" /></div>
      <div class="slide"><img src="https://picsum.photos/id/871/1300/1000" alt="Image9" /></div>
      <div class="slide"><img src="https://picsum.photos/id/910/1300/1000" alt="Image10" /></div>
    </div>

    <!-- Previous and Next buttons for navigation -->
    <button class="slider-btn prev">&#10094;</button>
    <button class="slider-btn next">&#10095;</button>

    <!-- Container for the small navigation dots -->
    <div class="dots-container"></div>
  </div>

  <!-- Link to external JavaScript file for slider functionality -->
  <script src="script.js"></script>
</body>
</html>
